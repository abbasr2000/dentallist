name: Ingest Ontario clinics

# This repository's own runners have the outbound network access that the
# ingest needs, so the pipeline runs here rather than on anyone's laptop.
# Results are committed back to the branch as JSON, which makes each run
# reviewable as a diff: you can see exactly which clinics appeared, moved or
# disappeared since last time.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Which sources to pull"
        type: choice
        default: osm
        options:
          - osm
          - osm+rcdso
          - rcdso
          - rcdso-probe
      rcdso_cities:
        description: "RCDSO: comma-separated cities, or 'all' for every city on the register"
        type: string
        default: "all"
  schedule:
    # Monthly. OSM and the register both change slowly.
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Fails fast on a logic regression before spending time on the network.
      - name: Offline checks
        run: npx tsx ingest/verify.ts

      - name: OpenStreetMap
        if: ${{ inputs.sources == 'osm' || inputs.sources == 'osm+rcdso' || inputs.sources == '' }}
        run: npx tsx ingest/osm.ts

      # The register's results markup is the one thing we cannot verify from the
      # dev sandbox, since rcdso.org is unreachable there. This prints the
      # structure of a real results page to the job log.
      - name: Probe the register's results page
        if: ${{ inputs.sources == 'rcdso-probe' }}
        run: |
          npx tsx ingest/rcdso.ts --probe Scarborough
          npx tsx ingest/rcdso.ts --probe-sedation

      - name: RCDSO public register
        if: ${{ inputs.sources == 'rcdso' || inputs.sources == 'osm+rcdso' }}
        env:
          CITIES_INPUT: ${{ inputs.rcdso_cities }}
        run: |
          # "all", or empty, walks every city the register knows. Anything else
          # is a comma-separated list, which is how a single city gets re-pulled
          # without paying for the whole province.
          if [ -z "$CITIES_INPUT" ] || [ "$CITIES_INPUT" = "all" ]; then
            npx tsx ingest/rcdso.ts
          else
            npx tsx ingest/rcdso.ts --cities-list "$CITIES_INPUT"
          fi

      - name: Merge into clinics
        if: ${{ inputs.sources != 'rcdso-probe' }}
        run: npx tsx ingest/merge.ts

      - name: Summary
        if: ${{ inputs.sources != 'rcdso-probe' }}
        run: |
          {
            echo "## Ingest results"
            echo
            for f in ingest/out/*.json; do
              [ -e "$f" ] || continue
              echo "- \`$f\` — $(node -e "console.log(JSON.parse(require('fs').readFileSync('$f','utf8')).length)") records"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.sources != 'rcdso-probe' }}
        with:
          name: ingest-output
          path: ingest/out/

      - name: Commit results
        if: ${{ inputs.sources != 'rcdso-probe' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ingest/out/
          if git diff --staged --quiet; then
            echo "No change in ingest output."
            exit 0
          fi
          git commit -m "Ingest: refresh clinic data ($(date -u +%Y-%m-%d))"

          # A long run can finish after someone has pushed to the branch, so
          # rebase onto whatever landed meanwhile rather than failing. The
          # ingest output is generated, so a rebase never conflicts meaningfully.
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase -X ours origin "$GITHUB_REF_NAME" || git rebase --abort
            sleep $((attempt * 3))
          done
          echo "Could not push the ingest output after 4 attempts." >&2
          exit 1
